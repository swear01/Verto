name: Controller tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify WebGL compatibility guard
        run: node Verification/WebTemplateTests.cjs
      - name: Verify Pipeline failure handling
        run: python3 Verification/BuildWebTests.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Run shared controller tests
        run: >-
          dotnet test Verification/ControllerTests.csproj
          --configuration Release
          --logger 'trx;LogFileName=controller-tests.trx'
          --results-directory TestResults
          --verbosity minimal
      - name: Require executed tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          counters = ET.parse('TestResults/controller-tests.trx').find('.//{*}Counters')
          assert counters is not None and int(counters.attrib['executed']) > 0
          assert int(counters.attrib['failed']) == 0
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install browser verification tools
        working-directory: Verification
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium --only-shell
      - name: Verify Web page dialogs and in-game editor file bridge with a mock Unity bridge
        run: node Verification/WebPageBrowser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-page-browser
          path: TestResults/WebPage/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: controller-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
