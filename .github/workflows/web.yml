name: Web build and preview

# Publish the playable build after Controller tests pass on main, so only gated commits go live.
on:
  workflow_run:
    workflows: [Controller tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-web
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: [self-hosted, macOS, ARM64, gamejam1-unity]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Keep the ignored Library between runs; a fresh import makes every build start cold.
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Open GUI Editor with Unity CLI
        run: |
          echo "$HOME/.unity/bin" >> "$GITHUB_PATH"
          "$HOME/.unity/bin/unity" open "$GITHUB_WORKSPACE" --editor-version 6000.4.7f1 --wait \
            --args "-logFile $RUNNER_TEMP/phase-editor.log" > "$RUNNER_TEMP/phase-launch.json" 2>&1 &
      - name: Test and build through live Pipeline
        run: python3 Verification/BuildWeb.py
      - name: Install browser verification tools
        working-directory: Verification
        run: |
          npm ci
          npx --no-install playwright install chromium
      - name: Verify the build loads and answers the keyboard
        run: node Verification/WebLoadSmoke.cjs Builds/Web
      - name: Close CI Editor
        if: always()
        run: '"$HOME/.unity/bin/unity" close "$GITHUB_WORKSPACE" --json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-verification
          path: TestResults/Web/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: Builds/Web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playable Web build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
