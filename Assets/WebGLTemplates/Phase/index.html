<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHASE</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #101a2b; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas { display: block; image-rendering: pixelated; }
    canvas:focus-visible { outline: 2px solid #79c9ff; outline-offset: -2px; }
    progress, #error { position: absolute; max-width: 80vw; color: #c0d4e8; }
    progress { width: 160px; accent-color: #79c9ff; }
    body, button { font: 16px/1.5 system-ui, sans-serif; color: #eadfc5; }
    button { min-height: 44px; padding: 8px 16px; border: 1px solid #697d8e; border-radius: 4px; background: #1d2b3d; cursor: pointer; }
    button:hover { background: #314254; }
    button:focus-visible { outline: 2px solid #79c9ff; outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: default; }
    .icon { width: 44px; padding: 10px; }
    .icon svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
    #controls-toggle { position: absolute; top: 16px; right: 16px; }
    #fullscreen-toggle { position: absolute; top: 16px; right: 72px; }
    #display-error { position: absolute; bottom: 16px; max-width: 80vw; padding: 8px 16px; background: #101a2b; }
    dialog { box-sizing: border-box; width: min(400px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; padding: 24px; overflow: auto; border: 1px solid #697d8e; border-radius: 4px; color: #eadfc5; background: #101a2b; }
    dialog::backdrop { background: #0b0f16cc; }
    dialog header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 22px; }
    #bindings { display: grid; gap: 8px; }
    .binding { display: grid; grid-template-columns: 2em repeat(2, minmax(0, 1fr)) 3em; align-items: center; gap: 8px; }
    .binding .key { min-width: 0; padding: 8px 10px; overflow-wrap: anywhere; }
    .binding .restore { min-width: 0; padding: 8px 4px; }
    .binding-head { margin-bottom: 8px; color: #c0d4e8; text-align: center; }
    .binding button[aria-pressed="true"] { border-color: #ffb24d; color: #ffb24d; }
    #controls-status { min-height: 48px; margin: 16px 0; color: #c0d4e8; }
    ::selection { color: #101a2b; background: #79c9ff; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="320" height="180" tabindex="0" aria-label="PHASE 遊戲畫面"></canvas>
  <progress id="loading" max="1" value="0" aria-label="載入遊戲"></progress>
  <p id="error" role="alert" hidden></p>
  <p id="display-error" role="alert" hidden></p>
  <button id="fullscreen-toggle" class="icon" aria-label="進入全螢幕" title="進入全螢幕" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
  <button id="controls-toggle" class="icon" aria-label="鍵位設定" title="鍵位設定" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M8 15v6"/></svg></button>
  <dialog id="controls" aria-labelledby="controls-title">
    <header><h1 id="controls-title">鍵位設定</h1><button id="controls-close" class="icon" aria-label="返回遊戲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="binding binding-head" aria-hidden="true"><span></span><span>第一組</span><span>第二組</span><span></span></div>
    <div id="bindings"></div>
    <p id="controls-status" role="status" aria-live="polite"></p>
  </dialog>
  <script src="controls.js"></script>
  <script src="webgl-compat.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    function resize() {
      const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
      const width = Math.max(320, Math.round(180 * w / h));
      const height = Math.max(180, Math.ceil(320 * h / w));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
      canvas.style.width = `${innerWidth}px`;
      canvas.style.height = `${innerHeight}px`;
    }
    function failed(message) {
      loading.hidden = true;
      const error = document.getElementById('error');
      error.textContent = '無法載入遊戲，請重新整理。';
      error.hidden = false;
      console.error(message);
    }
    addEventListener('resize', resize);
    const fullscreen = document.getElementById('fullscreen-toggle');
    fullscreen.addEventListener('click', async () => {
      const error = document.getElementById('display-error'); error.hidden = true;
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        error.textContent = '無法切換全螢幕，請在獨立分頁開啟遊戲後再試。'; error.hidden = false;
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const active = !!document.fullscreenElement;
      fullscreen.setAttribute('aria-pressed', String(active));
      fullscreen.title = active ? '退出全螢幕' : '進入全螢幕';
      fullscreen.setAttribute('aria-label', fullscreen.title);
      fullscreen.querySelector('path').setAttribute('d', active ? 'M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5' : 'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5');
      resize(); canvas.focus();
    });
    canvas.addEventListener('pointerdown', () => canvas.focus());
    resize();
    createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: false,
      showBanner: (message, type) => type === 'error' ? failed(message) : console.warn(message)
    }, value => loading.value = value).then(instance => {
      loading.hidden = true;
      setupControls(instance, canvas);
      fullscreen.hidden = false;
      canvas.focus();
    }).catch(failed);
  </script>
</body>
</html>
